<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="icon" sizes="32x32" type="image/png" href="https://open.spotifycdn.com/cdn/images/favicon32.b64ecc03.png"/> -->
</head>

<body>
    <header>
        <nav>
            <div class="left-nav">
                <div class="logo">
                    <img src="Resources/logo.svg" alt="Spotify-Icon">
                </div>
                <div class="search">
                    <div class="home">
                        <img src="Resources/home.svg" alt="Home-Icon">
                    </div>
                    <div class="input">
                        <img src="Resources/search.svg" alt="search">
                        <input class="text" type="text" name="search-text" id="search-text" placeholder="What do you want to play?">
                        <div class="bucket">
                            <span>|</span>
                            <img src="Resources/bucket.svg" alt="search-bucekt">
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-nav">
                <div class="part-1">
                    <ul>
                        <li>Premium</li>
                        <li>Support</li>
                        <li>Download</li>
                    </ul>
                </div>
                <div class="part-2">
                    <ul>
                        <li class="char">|</li>
                        <li><img src="Resources/install.svg" alt="install-icon">Install App</li>
                        <li>Sign Up</li>
                        <li><button class="login">Log in</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
